@startuml
skinparam defaultFontName Noto Sans CJK SC
skinparam titleFontName Noto Sans CJK SC
skinparam actorFontName Noto Sans CJK SC
skinparam usecaseFontName Noto Sans CJK SC
skinparam packageFontName Noto Sans CJK SC
skinparam classFontName Noto Sans CJK SC
skinparam classAttributeFontName Noto Sans CJK SC
skinparam shadowing false
skinparam packageStyle rectangle
skinparam classAttributeIconSize 0
hide circle
skinparam linetype ortho
skinparam nodesep 90
skinparam ranksep 70
skinparam dpi 140
skinparam wrapWidth 220
skinparam ArrowColor #7A1D3F
skinparam ActorBorderColor #7A1D3F
skinparam UsecaseBorderColor #7A1D3F
skinparam ClassBorderColor #7A1D3F
skinparam NoteBorderColor #7A1D3F
skinparam NoteBackgroundColor #FFF7D6
title 课程与成员详细类图（清晰版）
top to bottom direction
hide methods

package "参与者" {
  class "用户 User" as User <<entity>> {
    id
    role
    nickname
    status
  }

  class "教师 Teacher" as Teacher <<role>> {
    employeeNo
  }

  class "学生 Student" as Student <<role>> {
    studentNo
  }
}

package "课程结构" {
  class "课程 Course" as Course <<entity>> {
    id
    name
    term
    courseCode
    teacherId
    status
    allowGeneralAiAnswer
  }

  class "章节 Chapter" as Chapter <<entity>> {
    courseId
    title
    description
    orderIndex
  }

  class "课程封面 CourseCover" as Cover <<value>> {
    courseId
    coverUrl
    coverColor
  }
}

package "成员管理" {
  class "课程成员 CourseMembership" as Membership <<entity>> {
    courseId
    userId
    role
    joinedAt
  }

  class "课程邀请 CourseJoinCode" as JoinCode <<value>> {
    courseId
    code
    isEnabled
  }

  class "操作日志 OperationLog" as OperationLog <<entity>> {
    userId
    action
    targetType
    targetId
  }
}

User <|- - Teacher
User <|- - Student

Course "1" *- - "0..*" Chapter : 章节
Course "1" o- - "0..1" Cover : 封面
Course "1" o- - "0..1" JoinCode : 入课码
Course "1" o- - "0..*" Membership : 成员

@enduml


link UCCreate to UCChapter--><!--MD5=[5fee3e1cce13bf533d0edbb6349723e3]
link UCCreate to UCMembers--><!--MD5=[5171466e45e7091ad628399f210e2f59]
@startuml
skinparam defaultFontName Noto Sans CJK SC
skinparam titleFontName Noto Sans CJK SC
skinparam actorFontName Noto Sans CJK SC
skinparam usecaseFontName Noto Sans CJK SC
skinparam packageFontName Noto Sans CJK SC
skinparam classFontName Noto Sans CJK SC
skinparam classAttributeFontName Noto Sans CJK SC
skinparam shadowing false
skinparam packageStyle rectangle
skinparam classAttributeIconSize 0
hide circle
skinparam linetype ortho
skinparam nodesep 90
skinparam ranksep 70
skinparam dpi 140
skinparam wrapWidth 220
skinparam ArrowColor #7A1D3F
skinparam ActorBorderColor #7A1D3F
skinparam UsecaseBorderColor #7A1D3F
skinparam ClassBorderColor #7A1D3F
skinparam NoteBorderColor #7A1D3F
skinparam NoteBackgroundColor #FFF7D6
title 课程与成员详细用例图（清晰版）
left to right direction

actor "教师" as Teacher
actor "学生" as Student
actor "管理员" as Admin
actor "对象存储服务" as Storage

rectangle "课程与成员" {
  usecase "教师课程管理" as UCTeacherCourse
  usecase "学生选课与学习入口" as UCStudentCourse
  usecase "管理员课程治理" as UCAdminCourse

  package "教师侧明细" {
    usecase "创建课程\nPOST /courses" as UCCreate
    usecase "维护课程信息\nPATCH /courses/{course_id}" as UCUpdate
    usecase "上传课程封面\nPOST /courses/{course_id}/cover" as UCCover
    usecase "章节管理\nPOST /courses/{course_id}/chapters" as UCChapter
    usecase "成员列表\nGET /courses/{course_id}/members" as UCMembers
  }

  package "学生侧明细" {
    usecase "查看已加入课程\nGET /courses/enrolled" as UCEnrolled
    usecase "课程码加入\nPOST /courses/join" as UCJoin
    usecase "退出课程\nPOST /courses/{course_id}/leave" as UCLeave
    usecase "查看课程详情\nGET /courses/{course_id}" as UCDetail
    usecase "校验课程码与成员关系" as UCValidate
  }

  package "治理明细" {
    usecase "查看授课课程\nGET /courses/teaching" as UCTeaching
    usecase "启用 / 停用课程\nPOST /courses/{course_id}/activate|deactivate" as UCStatus
  }
}

Teacher - -> UCTeacherCourse
Student - -> UCStudentCourse
Admin - -> UCAdminCourse
Storage - -> UCCover

UCJoin ..> UCValidate : <<include>>
UCLeave ..> UCValidate : <<include>>
UCDetail ..> UCValidate : <<include>>

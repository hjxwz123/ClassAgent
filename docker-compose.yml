services:
  app:
    image: ${CLASSAGENT_IMAGE:-ghcr.io/hjxwz123/classagent:latest}
    container_name: classagent-app
    restart: unless-stopped
    ports:
      - "${CLASSAGENT_APP_PORT:-8001}:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: "${CLASSAGENT_SECRET_KEY:?set CLASSAGENT_SECRET_KEY}"
      DATABASE_URL: "mysql+pymysql://${CLASSAGENT_MYSQL_USER:-class_agent}:${CLASSAGENT_MYSQL_PASSWORD:?set CLASSAGENT_MYSQL_PASSWORD}@mysql:3306/${CLASSAGENT_MYSQL_DATABASE:-class_agent}?charset=utf8mb4"
      DB_POOL_SIZE: "${CLASSAGENT_DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${CLASSAGENT_DB_MAX_OVERFLOW:-20}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "false"
      CORS_ALLOW_ORIGINS: "${CLASSAGENT_CORS_ALLOW_ORIGINS:?set CLASSAGENT_CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "false"
      OPENAPI_ENABLED: "false"
      UPLOAD_AV_SCAN_ENABLED: "${CLASSAGENT_UPLOAD_AV_SCAN_ENABLED:?set CLASSAGENT_UPLOAD_AV_SCAN_ENABLED}"
      UPLOAD_AV_SCAN_COMMAND: "${CLASSAGENT_UPLOAD_AV_SCAN_COMMAND:?set CLASSAGENT_UPLOAD_AV_SCAN_COMMAND}"
      UPLOAD_AV_SCAN_TIMEOUT_SECONDS: "${CLASSAGENT_UPLOAD_AV_SCAN_TIMEOUT_SECONDS:-30}"
      UPLOAD_IMAGE_REENCODE_ENABLED: "true"
      UPLOAD_IMAGE_MAX_PIXELS: "${CLASSAGENT_UPLOAD_IMAGE_MAX_PIXELS:-20000000}"
      UPLOAD_IMAGE_MAX_WIDTH: "${CLASSAGENT_UPLOAD_IMAGE_MAX_WIDTH:-8000}"
      UPLOAD_IMAGE_MAX_HEIGHT: "${CLASSAGENT_UPLOAD_IMAGE_MAX_HEIGHT:-8000}"
      UPLOAD_IMAGE_REVIEW_ENABLED: "${CLASSAGENT_UPLOAD_IMAGE_REVIEW_ENABLED:?set CLASSAGENT_UPLOAD_IMAGE_REVIEW_ENABLED}"
      UPLOAD_IMAGE_REVIEW_COMMAND: "${CLASSAGENT_UPLOAD_IMAGE_REVIEW_COMMAND:?set CLASSAGENT_UPLOAD_IMAGE_REVIEW_COMMAND}"
      UPLOAD_IMAGE_REVIEW_TIMEOUT_SECONDS: "${CLASSAGENT_UPLOAD_IMAGE_REVIEW_TIMEOUT_SECONDS:-30}"
      EXTERNAL_AI_MODE: ${CLASSAGENT_EXTERNAL_AI_MODE:-auto}
      EXTERNAL_STORAGE_MODE: ${CLASSAGENT_EXTERNAL_STORAGE_MODE:-auto}
      PUBLIC_BASE_URL: "${CLASSAGENT_PUBLIC_BASE_URL:?set CLASSAGENT_PUBLIC_BASE_URL}"
      VECTOR_STORE_PROVIDER: ${CLASSAGENT_VECTOR_STORE_PROVIDER:-qdrant}
      QDRANT_URL: ${CLASSAGENT_QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${CLASSAGENT_QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${CLASSAGENT_QDRANT_COLLECTION_PREFIX:-classagent}
      QDRANT_TIMEOUT_SECONDS: ${CLASSAGENT_QDRANT_TIMEOUT_SECONDS:-10}
      EMBEDDING_DIMENSION: ${CLASSAGENT_EMBEDDING_DIMENSION:-1536}
      ADMIN_DEFAULT_EMAIL: ${CLASSAGENT_ADMIN_DEFAULT_EMAIL:-admin@classagent.com}
      ADMIN_DEFAULT_PASSWORD: "${CLASSAGENT_ADMIN_DEFAULT_PASSWORD:?set CLASSAGENT_ADMIN_DEFAULT_PASSWORD}"
      ADMIN_DEFAULT_NAME: ${CLASSAGENT_ADMIN_DEFAULT_NAME:-系统管理员}
    volumes:
      - classagent_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  worker:
    image: ${CLASSAGENT_IMAGE:-ghcr.io/hjxwz123/classagent:latest}
    container_name: classagent-worker
    restart: unless-stopped
    # 出题/材料等任务是大模型/外部 API 的 I/O 等待型（读期间释放 GIL），用线程池即可在单进程内
    # 承载远多于 CPU 核数的在途任务。并发度需 <= DB_POOL_SIZE + DB_MAX_OVERFLOW（默认 30）。
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info", "--pool=threads", "--concurrency=${CLASSAGENT_CELERY_CONCURRENCY:-12}"]
    environment:
      APP_ENV: production
      SECRET_KEY: "${CLASSAGENT_SECRET_KEY:?set CLASSAGENT_SECRET_KEY}"
      DATABASE_URL: "mysql+pymysql://${CLASSAGENT_MYSQL_USER:-class_agent}:${CLASSAGENT_MYSQL_PASSWORD:?set CLASSAGENT_MYSQL_PASSWORD}@mysql:3306/${CLASSAGENT_MYSQL_DATABASE:-class_agent}?charset=utf8mb4"
      DB_POOL_SIZE: "${CLASSAGENT_DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${CLASSAGENT_DB_MAX_OVERFLOW:-20}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "false"
      CORS_ALLOW_ORIGINS: "${CLASSAGENT_CORS_ALLOW_ORIGINS:?set CLASSAGENT_CORS_ALLOW_ORIGINS}"
      CORS_ALLOW_CREDENTIALS: "false"
      OPENAPI_ENABLED: "false"
      UPLOAD_AV_SCAN_ENABLED: "${CLASSAGENT_UPLOAD_AV_SCAN_ENABLED:?set CLASSAGENT_UPLOAD_AV_SCAN_ENABLED}"
      UPLOAD_AV_SCAN_COMMAND: "${CLASSAGENT_UPLOAD_AV_SCAN_COMMAND:?set CLASSAGENT_UPLOAD_AV_SCAN_COMMAND}"
      UPLOAD_AV_SCAN_TIMEOUT_SECONDS: "${CLASSAGENT_UPLOAD_AV_SCAN_TIMEOUT_SECONDS:-30}"
      UPLOAD_IMAGE_REENCODE_ENABLED: "true"
      UPLOAD_IMAGE_MAX_PIXELS: "${CLASSAGENT_UPLOAD_IMAGE_MAX_PIXELS:-20000000}"
      UPLOAD_IMAGE_MAX_WIDTH: "${CLASSAGENT_UPLOAD_IMAGE_MAX_WIDTH:-8000}"
      UPLOAD_IMAGE_MAX_HEIGHT: "${CLASSAGENT_UPLOAD_IMAGE_MAX_HEIGHT:-8000}"
      UPLOAD_IMAGE_REVIEW_ENABLED: "${CLASSAGENT_UPLOAD_IMAGE_REVIEW_ENABLED:?set CLASSAGENT_UPLOAD_IMAGE_REVIEW_ENABLED}"
      UPLOAD_IMAGE_REVIEW_COMMAND: "${CLASSAGENT_UPLOAD_IMAGE_REVIEW_COMMAND:?set CLASSAGENT_UPLOAD_IMAGE_REVIEW_COMMAND}"
      UPLOAD_IMAGE_REVIEW_TIMEOUT_SECONDS: "${CLASSAGENT_UPLOAD_IMAGE_REVIEW_TIMEOUT_SECONDS:-30}"
      EXTERNAL_AI_MODE: ${CLASSAGENT_EXTERNAL_AI_MODE:-auto}
      EXTERNAL_STORAGE_MODE: ${CLASSAGENT_EXTERNAL_STORAGE_MODE:-auto}
      PUBLIC_BASE_URL: "${CLASSAGENT_PUBLIC_BASE_URL:?set CLASSAGENT_PUBLIC_BASE_URL}"
      VECTOR_STORE_PROVIDER: ${CLASSAGENT_VECTOR_STORE_PROVIDER:-qdrant}
      QDRANT_URL: ${CLASSAGENT_QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${CLASSAGENT_QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${CLASSAGENT_QDRANT_COLLECTION_PREFIX:-classagent}
      QDRANT_TIMEOUT_SECONDS: ${CLASSAGENT_QDRANT_TIMEOUT_SECONDS:-10}
      EMBEDDING_DIMENSION: ${CLASSAGENT_EMBEDDING_DIMENSION:-1536}
      ADMIN_DEFAULT_EMAIL: ${CLASSAGENT_ADMIN_DEFAULT_EMAIL:-admin@classagent.com}
      ADMIN_DEFAULT_PASSWORD: "${CLASSAGENT_ADMIN_DEFAULT_PASSWORD:?set CLASSAGENT_ADMIN_DEFAULT_PASSWORD}"
      ADMIN_DEFAULT_NAME: ${CLASSAGENT_ADMIN_DEFAULT_NAME:-系统管理员}
    volumes:
      - classagent_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: classagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${CLASSAGENT_MYSQL_ROOT_PASSWORD:?set CLASSAGENT_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ${CLASSAGENT_MYSQL_DATABASE:-class_agent}
      MYSQL_USER: ${CLASSAGENT_MYSQL_USER:-class_agent}
      MYSQL_PASSWORD: "${CLASSAGENT_MYSQL_PASSWORD:?set CLASSAGENT_MYSQL_PASSWORD}"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - classagent_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: classagent-redis
    restart: unless-stopped
    volumes:
      - classagent_redis:/data

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: classagent-qdrant
    restart: unless-stopped
    volumes:
      - classagent_qdrant:/qdrant/storage

volumes:
  classagent_storage:
  classagent_mysql:
  classagent_redis:
  classagent_qdrant:

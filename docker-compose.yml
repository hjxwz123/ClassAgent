services:
  app:
    image: ${CLASSAGENT_IMAGE:-ghcr.io/hjxwz123/classagent:latest}
    container_name: classagent-app
    restart: unless-stopped
    ports:
      - "${CLASSAGENT_APP_PORT:-8001}:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${CLASSAGENT_SECRET_KEY:-replace-with-a-long-random-secret}
      DATABASE_URL: mysql+pymysql://${CLASSAGENT_MYSQL_USER:-class_agent}:${CLASSAGENT_MYSQL_PASSWORD:-class_agent_2026}@mysql:3306/${CLASSAGENT_MYSQL_DATABASE:-class_agent}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "false"
      EXTERNAL_AI_MODE: ${CLASSAGENT_EXTERNAL_AI_MODE:-auto}
      EXTERNAL_STORAGE_MODE: ${CLASSAGENT_EXTERNAL_STORAGE_MODE:-auto}
      PUBLIC_BASE_URL: ${CLASSAGENT_PUBLIC_BASE_URL:-http://localhost:${CLASSAGENT_APP_PORT:-8001}}
      VECTOR_STORE_PROVIDER: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${CLASSAGENT_QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${CLASSAGENT_QDRANT_COLLECTION_PREFIX:-classagent}
      QDRANT_TIMEOUT_SECONDS: ${CLASSAGENT_QDRANT_TIMEOUT_SECONDS:-10}
      EMBEDDING_DIMENSION: ${CLASSAGENT_EMBEDDING_DIMENSION:-1536}
      ADMIN_DEFAULT_EMAIL: ${CLASSAGENT_ADMIN_DEFAULT_EMAIL:-admin@classagent.com}
      ADMIN_DEFAULT_PASSWORD: ${CLASSAGENT_ADMIN_DEFAULT_PASSWORD:-Admin123456}
      ADMIN_DEFAULT_NAME: ${CLASSAGENT_ADMIN_DEFAULT_NAME:-系统管理员}
    volumes:
      - classagent_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  worker:
    image: ${CLASSAGENT_IMAGE:-ghcr.io/hjxwz123/classagent:latest}
    container_name: classagent-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${CLASSAGENT_SECRET_KEY:-replace-with-a-long-random-secret}
      DATABASE_URL: mysql+pymysql://${CLASSAGENT_MYSQL_USER:-class_agent}:${CLASSAGENT_MYSQL_PASSWORD:-class_agent_2026}@mysql:3306/${CLASSAGENT_MYSQL_DATABASE:-class_agent}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "false"
      EXTERNAL_AI_MODE: ${CLASSAGENT_EXTERNAL_AI_MODE:-auto}
      EXTERNAL_STORAGE_MODE: ${CLASSAGENT_EXTERNAL_STORAGE_MODE:-auto}
      PUBLIC_BASE_URL: ${CLASSAGENT_PUBLIC_BASE_URL:-http://localhost:${CLASSAGENT_APP_PORT:-8001}}
      VECTOR_STORE_PROVIDER: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${CLASSAGENT_QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${CLASSAGENT_QDRANT_COLLECTION_PREFIX:-classagent}
      QDRANT_TIMEOUT_SECONDS: ${CLASSAGENT_QDRANT_TIMEOUT_SECONDS:-10}
      EMBEDDING_DIMENSION: ${CLASSAGENT_EMBEDDING_DIMENSION:-1536}
      ADMIN_DEFAULT_EMAIL: ${CLASSAGENT_ADMIN_DEFAULT_EMAIL:-admin@classagent.com}
      ADMIN_DEFAULT_PASSWORD: ${CLASSAGENT_ADMIN_DEFAULT_PASSWORD:-Admin123456}
      ADMIN_DEFAULT_NAME: ${CLASSAGENT_ADMIN_DEFAULT_NAME:-系统管理员}
    volumes:
      - classagent_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  mysql:
    image: mysql:8.4
    container_name: classagent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${CLASSAGENT_MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${CLASSAGENT_MYSQL_DATABASE:-class_agent}
      MYSQL_USER: ${CLASSAGENT_MYSQL_USER:-class_agent}
      MYSQL_PASSWORD: ${CLASSAGENT_MYSQL_PASSWORD:-class_agent_2026}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - classagent_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: classagent-redis
    restart: unless-stopped
    volumes:
      - classagent_redis:/data

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: classagent-qdrant
    restart: unless-stopped
    volumes:
      - classagent_qdrant:/qdrant/storage

volumes:
  classagent_storage:
  classagent_mysql:
  classagent_redis:
  classagent_qdrant:

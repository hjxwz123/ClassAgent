[project]
name = "class-agent-backend"
version = "0.1.0"
description = "课程学习助手智能体后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "pillow>=10.0,<13.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "pymysql>=1.1,<2.0",
  "chromadb>=1.3,<2.0",
  "qdrant-client>=1.11,<2.0",
  "langchain-core>=1.1,<2.0",
  "oss2>=2.19,<3.0",
  "alibabacloud-ocr-api20210707>=3.1,<4.0",
  "alibabacloud-docmind-api20220711>=1.4,<2.0",
  "nls @ git+https://github.com/aliyun/alibabacloud-nls-python-sdk.git@177972b1f02fcb1f2b229e77320a7286d21785f3",
  "aliyun-python-sdk-core>=2.15,<3.0",
  "alibabacloud-tea-openapi>=0.3,<1.0",
  "alibabacloud-tea-util>=0.3,<1.0",
  "bcrypt>=4.0,<4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "python-pptx>=1.0,<2.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
